<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Viewer</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong colours.
      (function () {
        try {
          var t = localStorage.getItem('chat-viewer-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = t;
          // Text size and zoom (see src/display.ts).
          var d = JSON.parse(localStorage.getItem('chat-viewer-display') || 'null');
          if (d && typeof d.textScale === 'number' && typeof d.zoom === 'number') {
            document.documentElement.style.fontSize = d.textScale * 100 + '%';
            document.documentElement.style.setProperty('--ui-zoom', String(d.zoom));
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
